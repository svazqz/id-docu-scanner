<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="project-title project-description">
  <title id="project-title">ID Document Scanner</title>
  <desc id="project-description">Capture documents in the browser.</desc>
  <defs>
    <linearGradient id="background">
      <stop offset="0" stop-color="#17223A"/>
      <stop offset="1" stop-color="#2B3B6B"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#BDCAFF" stop-opacity=".23"/>
      <stop offset="1" stop-color="#BDCAFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="21" height="21" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#92ABFF" opacity=".38"/>
    </pattern>
    <linearGradient id="accent">
      <stop stop-color="#BDCAFF"/><stop offset="1" stop-color="#92ABFF" stop-opacity=".26"/>
    </linearGradient>
    <clipPath id="corners"><rect x="1" y="1" width="1198" height="258" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#corners)">
    <rect width="1200" height="260" fill="url(#background)"/>
    <ellipse cx="1016" cy="125" rx="299" ry="204" fill="url(#glow)"/>
    <rect x="803" width="397" height="260" fill="url(#dots)" opacity=".51"/>
    <path d="M769 224h77l41-42h83M807 55h81l27 27h118m-92 94h128l45-45h102" fill="none" stroke="#92ABFF" stroke-opacity=".29" stroke-width="2"/>
    <circle cx="845" cy="224" r="4" fill="#BDCAFF" opacity=".76"/>
    <circle cx="887" cy="55" r="4" fill="#BDCAFF" opacity=".76"/>
    <circle cx="1114" cy="131" r="4" fill="#BDCAFF" opacity=".76"/>
    <rect x="932" y="40" width="170" height="170" rx="31" fill="#17223A" fill-opacity=".86" stroke="#92ABFF" stroke-opacity=".56"/>
    <rect x="945" y="53" width="144" height="144" rx="24" fill="none" stroke="#92ABFF" stroke-opacity=".23"/>
    <g transform="translate(948 56) scale(.85)" fill="none" stroke="#BDCAFF" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round"><rect x="25" y="55" width="104" height="75" rx="10"/><path d="M45 47v-5a9 9 0 0 1 9-9h79a9 9 0 0 1 9 9v59a9 9 0 0 1-6 9 M25 73h104 M44 92h61 M44 109h42"/></g>
    <rect x="61" y="246" width="125" height="3" rx="1.5" fill="url(#accent)"/>
  </g>

  <rect x="1" y="1" width="1198" height="258" rx="26" fill="none" stroke="#92ABFF" stroke-opacity=".42"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="61" y="55" fill="#BDCAFF" font-size="15" font-weight="750" letter-spacing="3">PAAS</text>
    <text x="58" y="123" fill="#FCFDFF" font-size="64" font-weight="760" letter-spacing="-1.3">ID Document Scanner</text>
    <text x="62" y="165" fill="#D6DFEE" font-size="24">Capture documents in the browser.</text>
    <rect x="61" y="193" width="79" height="34" rx="17" fill="#FFFFFF" fill-opacity=".08" stroke="#92ABFF" stroke-opacity=".39"/><text x="79" y="215" fill="#E8EDF5" font-size="15" font-weight="600">React</text><rect x="151" y="193" width="122" height="34" rx="17" fill="#FFFFFF" fill-opacity=".08" stroke="#92ABFF" stroke-opacity=".39"/><text x="169" y="215" fill="#E8EDF5" font-size="15" font-weight="600">TypeScript</text><rect x="284" y="193" width="53" height="34" rx="17" fill="#FFFFFF" fill-opacity=".08" stroke="#92ABFF" stroke-opacity=".39"/><text x="302" y="215" fill="#E8EDF5" font-size="15" font-weight="600">Nx</text>
  </g>
</svg>
